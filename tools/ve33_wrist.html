<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SuperDex · MotorHand 接触诊断</title>
<style>
:root{color-scheme:dark;--base:#101b28;--border:#344a5d;--bright:#edf6fa;--soft:#a6bfce;--cyan:#86deed}
*{box-sizing:border-box}body{margin:0;background:var(--base);color:var(--bright);font:16px system-ui,sans-serif}
main{max-width:1440px;margin:auto;padding:clamp(16px,4vw,42px)}
header{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:clamp(22px,4vw,32px);margin:0;letter-spacing:.025em}
button,select{font:inherit;border:1px solid var(--border);border-radius:7px;padding:9px 13px;background:#20384b;color:var(--bright)}
button{background:var(--cyan);color:#082537;font-weight:700}button:disabled{opacity:.5}
#preview{position:relative;width:100%;aspect-ratio:16/10;min-height:310px;max-height:72vh;overflow:hidden;background:#182331;border:1px solid var(--border);border-radius:12px}
#preview canvas{display:block;width:100%;height:100%;touch-action:none}
.controls{display:flex;gap:12px 21px;align-items:center;flex-wrap:wrap;margin:13px 0}
.controls label{display:flex;gap:9px;align-items:center}.controls [hidden]{display:none}
.cube-settings{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.cube-settings[hidden],.cube-settings [hidden]{display:none}
.cube-settings button{background:#20384b;color:var(--bright)}
.local-grasp{margin:13px 0;padding:13px 15px;border:1px solid var(--border);border-radius:10px;background:#152332}
.local-grasp .controls{margin:5px 0}.local-grasp output{min-width:50px}
a{color:var(--cyan)}
input[type=range]{width:110px;accent-color:var(--cyan)} output{min-width:43px;color:var(--cyan)}
#status{margin:0;color:#d8eff5}p{line-height:1.55;color:var(--soft)}
#g4-control{margin-top:24px;border:1px solid var(--border);border-radius:12px;background:#152332;overflow:hidden}
.g4-header{padding:15px 17px;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px}
h2{font-size:21px;margin:0 0 5px}.g4-buttons{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.g4-buttons button{font-size:15px;padding:7px 10px}
.g4-buttons button[data-control=disable]{background:#f6a497;color:#26161a}
#feedback-state{color:#f4ca89}#feedback-state[data-active=yes]{color:#8fe7cf}
.g4-meta{padding:0 17px 11px;color:var(--soft);font-size:15px;display:flex;gap:11px;flex-wrap:wrap}
.g4-table{overflow:auto}table{border-collapse:collapse;width:100%;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
th,td{text-align:right;border-top:1px solid #293e50;padding:9px 11px}th{color:var(--soft);background:#1c2f41}
th:nth-child(2),td:nth-child(2){text-align:left}tbody tr:hover{background:#1b3040}
</style>
<main>
<header><h1>右手与二阶魔方</h1><button id="start" disabled>进入头显场景</button></header>
<div id="preview" aria-label="实时仿真与受力诊断视窗"></div>
<div class="controls">
  <div id="cube-settings" class="cube-settings" hidden>
    <label id="cube-mode-control">魔方模式 <select id="cube-mode" disabled><option value="fixed">固定中心</option><option value="free">自由抓取</option></select></label>
    <button id="reset-scene" disabled>初始化场景</button>
    <span id="scene-message" role="status"></span>
  </div>
  <label>右腕定位
    <select id="source"><option value="controller">右手柄</option><option value="hand">光学手部追踪</option></select>
  </label>
  <label><input id="show-diagnostics" type="checkbox" checked>显示半透明受力手</label>
  <label>颜色满量程 <input id="force-scale" type="range" min="2" max="40" value="12"><output id="scale-value">12 N</output></label>
</div>
<p id="status" role="status">正在加载模型…</p>
<p id="xr-hint">头显中保持右手掌背朝上、指尖向前，按右手柄食指扳机对齐。光学定位可用左手捏合对齐。左手或左手柄可扶角块。上方箭头显示右手各连杆的仿真接触合力，电机指令与回报分别列在面板上。</p>
<section id="local-grasp" class="local-grasp" aria-label="本地抓握设置" hidden>
  <div class="controls">
    <label>场景 <select data-grasp="layout"><option value="palm">掌心</option><option value="desk">桌面</option></select></label>
    <label>物体 <select data-grasp="kind"><option value="ball">球</option><option value="box">方块</option><option value="cylinder">圆柱</option></select></label>
    <label>尺寸 <input data-grasp="size_mm" type="range" min="20" max="150" value="45" aria-describedby="grasp-size-hint"><output data-value="size_mm">45 mm</output></label>
    <small id="grasp-size-hint">拖动预览尺寸，松手应用到仿真</small>
    <label>硬度（1 为刚体） <input data-grasp="hardness" type="range" min="0" max="1" step="0.01" value="0.25"><output data-value="hardness">0.25</output></label>
    <label>旋转 <input data-grasp="angle_deg" type="range" min="-180" max="180" value="0"><output data-value="angle_deg">0°</output></label>
    <label><input data-grasp="locked" type="checkbox" checked>锁定物体</label>
    <button id="grasp-home">物体归位</button>
  </div>
  <div id="demo-controls" class="controls" hidden>
    <label>演示闭合 <input id="demo-grip" type="range" min="0" max="1" step="0.01" value="0"></label>
    <button id="demo-auto">自动开合</button>
  </div>
  <div class="controls">
    <button id="grasp-record">开始记录</button>
    <a id="grasp-csv" href="/api/v1/recording.csv" download hidden>下载 CSV</a>
    <span id="grasp-message" role="status"></span>
  </div>
</section>
<section id="g4-control" aria-label="MotorHand 网页控制台">
<div class="g4-header">
  <div><h2>MotorHand 控制台</h2><span id="feedback-state" role="status">等待控制进程</span></div>
  <div class="g4-buttons">
    <button disabled data-control="enable">启用力反馈</button>
    <button disabled data-control="disable">停止力反馈</button>
    <button disabled data-control="align">对齐右腕</button>
    <button disabled data-control="zero">标零并卸力</button>
  </div>
</div>
<div class="g4-meta"><span id="calibration-state"></span><span id="timing"></span><span id="command-message"></span></div>
<div class="g4-table">
<table>
<thead><tr><th>轴</th><th>模型电机</th><th>编码器 °</th><th>输入 rad</th><th>仿真 rad</th><th title="仿真物理接触力投影至电机轴">接触投影 N·m</th><th title="真实接触且方向相符时的角差补偿">位置补偿 N·m</th><th title="接触与位置力矩经滤波限幅后的模型值">名义 N·m</th><th title="已提交 MIT 的前馈电机轴力矩">下发 N·m</th><th>电机 A</th><th>年龄 ms</th><th>状态</th></tr></thead>
<tbody id="axes-body"></tbody>
</table>
</div>
</section>
</main>
<script type="module" src="/quest-scene.js"></script>
</html>
