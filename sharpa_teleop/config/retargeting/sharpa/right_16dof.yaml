# sharpa_teleop/tools/fit_16dof_retarget.py 针对 hand_motor_16dof_R 闭链模型联合拟合生成。
# 16-DOF 模式释放全部 22 个 Sharpa 自由度（含四指 MCP_AA 侧摆），不修改 12-DOF right.yaml。
geometry:
