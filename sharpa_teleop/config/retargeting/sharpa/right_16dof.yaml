  urdf_path: ../../../assets/sharpa-hand/wave_01/right_sharpa_wave/right_sharpa_wave_pad.urdf
  link_naming:
    prefix: right_
    palm: hand_C_MC
    fingers:
    - thumb
    - index
    - middle
    - ring
    - pinky
    pip: '{finger}_pad_pip'
    dip: '{finger}_pad_dip'
    tip: '{finger}_pad_tip'
